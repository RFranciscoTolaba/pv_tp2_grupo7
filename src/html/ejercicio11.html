<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <script> 

        let km = prompt("Ingrese numero de kilometros recorridos: ");
        let n = prompt("Ingrese cantidad de litros de combustible consumidos:");
        const resultado = n / km;
        document.write(`Consumo de combustible por kilometro: ${resultado}`);


    </script>
</body>
</html>
