<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 21 - Países y Capitales</title>
    <link rel="stylesheet" href="../../assets/css/ejercicio21.css">
</head>
<body>
    <div class="contenedor">
        <h2>Selecciona un destino</h2>
        
        <label for="pais">País de América:</label>
        <select id="pais">
            <option value="argentina">Argentina</option>
            <option value="brasil">Brasil</option>
            <option value="chile">Chile</option>
            <option value="colombia">Colombia</option>
            <option value="peru">Perú</option>
            <option value="mexico">México</option>
        </select>
        
        <br><br>

        <label for="capital">Capital:</label>
        <select id="capital" disabled>
            <option value="argentina">Buenos Aires</option>
            <option value="brasil">Brasilia</option>
            <option value="chile">Santiago</option>
            <option value="colombia">Bogotá</option>
            <option value="peru">Lima</option>
            <option value="mexico">Ciudad de México</option>
        </select>
    </div>

    <script type="module" src="../js/ejercicio21.js"></script>
</body>
</html>
