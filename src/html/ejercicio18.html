<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>

        let numero1 = Number(prompt("Ingrese un numero:"));
        let numero2 = Number(prompt("Ingrese numero: "));





        let calcularMayor = (numero1,numero2) => {
            
            if (numero1>numero2){
                document.write(`${numero1} es mayor que ${numero2}`);
            }else if(numero2>numero1){
                document.write(`${numero2} es mayor que ${numero1}`);
            }else{
                document.write(`${numero2} es igual que ${numero1}`);
            }

        }

        calcularMayor(numero1, numero2);

    </script>
</body>
</html>
