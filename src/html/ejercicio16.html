<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 16</title>
</head>
<body>
    <script>
        const sumarRango = (inicial, final) => {
            let suma = 0;
            
            for (let i = inicial; i <= final; i++) {
                suma += i;
            }
            
            return suma;
        };

        const numeroInicial = parseInt(prompt("Ingrese el número inicial del rango:"));
        const numeroFinal = parseInt(prompt("Ingrese el número final del rango:"));

        if (numeroInicial <= numeroFinal) {
            const resultado = sumarRango(numeroInicial, numeroFinal);
            document.write(`La suma de todos los números en el rango de ${numeroInicial} a ${numeroFinal} es: <strong>${resultado}</strong>`);
        } else {
            document.write(`Error: El número inicial (${numeroInicial}) debe ser menor o igual que el número final (${numeroFinal}). Recarga la página e intenta de nuevo.`);
        }
    </script>
</body>
</html>
