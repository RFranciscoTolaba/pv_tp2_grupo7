<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 15</title>
</head>
<body>
    <script>
    let mes = prompt("Ingrese el número de un mes")
    let meses = Number(mes)

    function retornarMes(meses){
        if(meses == 1){
            return "Enero"
        }else if(meses == 2){
            return "Febrero"
        }else if(meses == 3){
            return "Febrero"
        }else if(meses == 4){
            return "Febrero"
        }else if(meses == 5){
            return "Febrero"
        }else if(meses == 6){
            return "Febrero"
        }else if(meses == 7){
            return "Febrero"
        }else if(meses == 8){
            return "Febrero"
        }else if(meses == 9){
            return "Febrero"
        }else if(meses == 10){
            return "Febrero"
        }else if(meses == 11){
            return "Febrero"
        }else if(meses == 12){
            return "Febrero"
        }else{
            return "No es un mes valido"
        }
    }
    let resultado = retornarMes(meses)
    document.write(resultado)
    </script>
</body>
</html>
